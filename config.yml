input_file: "/home/mohammedalsalihi/LidarData/for_mohammed/fh_underground.las"

reset_classification: true

chunk_size: 10000000

previewer:
  maximum_points: 500000

filter_noise: true

ground_segmentation:
  enable: true
  method: csf # basic or csf
  csf_params: # only for csf method
    threshold_factor: 0.1
    resolution: 3
    rigidness: 3
    max_iter: 500

ceiling_segmentation:
  enable: true
  epsilon: 0.01
  min_support_points: 2000
  max_tilt_from_horizontal_deg: 10.0
  max_iterations: 1000
  min_plane_size_ratio: 0.01
  min_height_above_ground: 0.0
  max_height_above_ground: 10.0

wall_segmentation:
  enable: true
  filter_noise_after_segmenetation: true

result: # the resulted pointed cloud from the program
  display_result: false
  output_folder_path: "/home/mohammedalsalihi/LidarData/for_mohammed/fh_underground_result"
  overwrite_output_folder: true
