input_file: "/home/mohammedalsalihi/LidarData/for_mohammed/fh_underground.las"

reset_classification: true

chunk_size: 25000

downsample:
  voxel_size: 0.15

previewer:
  maximum_points: 500000

filter_noise:
  nb_neighbors: 20
  std_ratio: 2.0

ground_segmentation:
  enable: true
  # method: basic | csf | ransac
  method: ransac
  csf_params: # used when method is csf
    threshold_factor: 0.1
    resolution: 3
    rigidness: 3
    max_iter: 500
  ransac_params: # used when method is ransac
    distance_threshold: 0.1
    num_iterations: 10

ceiling_segmentation:
  enable: true
  facing_up_threshold: 0.95
  min_inlier_density: 15

wall_segmentation:
  enable: true
  rotation_threshold: 0.9

objects_segmentation:
  enable: true
  eps: 0.35
  min_points: 15

result: # the resulted pointed cloud from the program
  display_result: false
  output_folder_path: "/home/mohammedalsalihi/LidarData/for_mohammed/fh_underground_result"
