input_file: "/home/mohammedalsalihi/LidarData/for_mohammed/fh_underground.las"

reset_classification: true

chunk_size: 25000

downsample:
  voxel_size: 0.2

previewer:
  maximum_points: 500000

filter_noise:
  nb_neighbors: 20
  std_ratio: 2.0

ground_segmentation:
  enable: true
  # method: basic | csf | ransac
  method: ransac
  csf_params: # used when method is csf
    threshold_factor: 0.1
    resolution: 3
    rigidness: 3
    max_iter: 500
  ransac_params: # used when method is ransac
    distance_threshold: 0.1
    num_iterations: 10

ceiling_segmentation:
  enable: true
  facing_up_threshold: 0.1
  min_inlier_density: 5

wall_segmentation:
  enable: true
  rotation_threshold: 0.9

objects_segmentation:
  enable: true
  eps: 0.35
  min_points: 10
  create_unique_trace_dirs: false

collect_runtime_report: true

vlm:
  provider: "claude"   # ollama | claude
  views_count: 8
  ollama:
    # model: "qwen3.5:27b"
    # model: "qwen3-vl:8b"
    # host: "http://192.168.196.108:11434"
    model: "gemma4:e2b"
    host: "http://localhost:11434"
  claude: # needs ANTHROPIC_API_KEY in the environment (never put the key in this file)
    model: "claude-haiku-5-5"  # or claude-sonnet-5-5 / claude-haiku-5-5 for cheaper runs
    effort: "low"             # low | medium | high | xhigh | max
    max_tokens: 4096          # covers thinking + the JSON answer
    max_retries: 2            # SDK retries for 429 / 5xx / connection errors
    timeout_seconds: 120
    refusal_fallback: true    # rerun on another model if a safety classifier declines

cityjson_export:
  enable: true
  # Ball-neighbourhood mesh for CityJSON export (see modules/models/mesh_tools/ball_neighbourhood_mesh.py).
  # Optional: ball_radius (meters) or ball_radius_ground / ball_radius_wall / ball_radius_ceiling.
  # If omitted, ball radius is estimated per surface via estimate_ball_radius.
  # max_faces: 1000000
  # min_neighbours: 4

result: # the resulted pointed cloud from the program
  display_result: false
  output_folder_path: "/home/mohammedalsalihi/LidarData/for_mohammed/fh_underground_result"
